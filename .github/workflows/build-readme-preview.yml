name: Build README preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-readme-preview.yml"
      - "assets/preview.webp"

permissions:
  contents: write

jobs:
  convert-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert WebP preview to JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/preview.webp")
          dst = Path("assets/preview.jpg")
          with Image.open(src) as image:
              image.convert("RGB").save(dst, "JPEG", quality=92, optimize=True, progressive=True)

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("./assets/preview.webp", "./assets/preview.jpg")
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Commit generated JPEG and README fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/preview.jpg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: use JPEG preview in README"
          git push
